<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet Dashboard</title>
<style>
/* ============================================================
   Fleet dashboard - deliberately plain "internal tool" styling.
   No display face, no illustration, no brand chrome: this page
   exists so the captain can scan project health in one glance.
   ============================================================ */
:root {
  color-scheme: light;
  --bg-page:      #f9f9f7;
  --bg-surface:   #fcfcfb;
  --bg-raised:    #ffffff;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:   #898781;
  --border:       rgba(11, 11, 11, 0.10);
  --border-strong: #c3c2b7;
  --good:         #0ca30c;
  --good-soft:    #e4f5e4;
  --critical:     #d03b3b;
  --critical-soft: #fbe8e8;
  --warning:      #a8710a;
  --warning-soft: #fbeed2;
  --recent-mine-bg:     #e2f0ff;
  --recent-mine-border: #8fbdf0;
  --recent-team-bg:     #fce8d3;
  --recent-team-border: #e3ab68;
  --critical-ink: #ffffff;
  --conn-ink:     #0b1c2e;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg-page:      #0d0d0d;
    --bg-surface:   #1a1a19;
    --bg-raised:    #212120;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:   #898781;
    --border:       rgba(255, 255, 255, 0.10);
    --border-strong: #383835;
    --good:         #0ca30c;
    --good-soft:    #123312;
    --critical:     #e66767;
    --critical-soft: #3a1414;
    --warning:      #d9a441;
    --warning-soft: #362a10;
    --recent-mine-bg:     #16283d;
    --recent-mine-border: #4a83c4;
    --recent-team-bg:     #3a2a10;
    --recent-team-border: #b8802f;
    --critical-ink: #2a0d0d;
    --conn-ink:     #ffffff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
}
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}
header.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-strong);
  margin-bottom: 20px;
}
header.page-head h1 {
  font-size: 1.15rem;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.01em;
}
.generated {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-muted);
}
.summary {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-bottom: 20px;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text-secondary);
}
.summary strong {
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.summary .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.card.open { border-color: var(--border-strong); }
.card.recent-mine { background: var(--recent-mine-bg); border-color: var(--recent-mine-border); }
.card.recent-team { background: var(--recent-team-bg); border-color: var(--recent-team-border); }
button.card-head {
  all: unset;
  box-sizing: border-box;
  width: 100%;
  cursor: pointer;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 6px 10px;
}
button.card-head:focus-visible {
  outline: 2px solid var(--text-primary);
  outline-offset: -2px;
}
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  grid-row: 1 / 3;
}
.status-dot.clean { background: var(--good); }
.status-dot.uncommitted { background: var(--critical); }
.status-dot.unknown { background: var(--text-muted); }
.proj-name {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.95rem;
  overflow-wrap: anywhere;
}
.status-label {
  grid-column: 3;
  grid-row: 1;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
.status-label.clean { color: var(--good); background: var(--good-soft); }
.status-label.uncommitted { color: var(--critical); background: var(--critical-soft); }
.status-label.unknown { color: var(--text-muted); background: var(--border); }
.branch-row {
  grid-column: 2 / 4;
  grid-row: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-secondary);
}
.branch-name { overflow-wrap: anywhere; }
.branch-flag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--warning);
  background: var(--warning-soft);
  border-radius: 3px;
  padding: 1px 5px;
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 0.72rem;
  white-space: nowrap;
}
.last-commit {
  grid-column: 2 / 4;
  grid-row: 3;
  font-size: 0.78rem;
  color: var(--text-muted);
  overflow-wrap: anywhere;
}
.unavailable-reason {
  grid-column: 2 / 4;
  grid-row: 2;
  font-size: 0.8rem;
  color: var(--text-muted);
  font-style: italic;
}
.commits-panel {
  display: none;
  border-top: 1px solid var(--border);
  padding: 8px 14px 12px;
  background: var(--bg-raised);
}
.card:hover .commits-panel,
.card.open .commits-panel {
  display: block;
}
.commits-panel ol {
  list-style: none;
  margin: 0;
  padding: 0;
}
.commits-panel li {
  display: grid;
  grid-template-columns: 5.5em 11em 1fr;
  gap: 10px;
  padding: 4px 0;
  font-family: var(--font-mono);
  font-size: 0.76rem;
  border-bottom: 1px dotted var(--border);
}
.commits-panel li:last-child { border-bottom: none; }
.commits-panel .hash { color: var(--text-muted); }
.commits-panel .date { color: var(--text-secondary); white-space: nowrap; }
.commits-panel .subject { color: var(--text-primary); font-family: var(--font-sans); overflow-wrap: anywhere; }
.commits-panel .author {
  grid-column: 1 / 4;
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: 0.72rem;
  padding-bottom: 2px;
}
.empty-state {
  padding: 32px;
  text-align: center;
  color: var(--text-muted);
}

/* ============================================================
   LIVE WORK - one row per running task, sorted so whatever
   wants the captain is at the top. Same plain internal-tool
   styling as the project half: no new type, no chrome, colour
   only where it carries a signal.
   ============================================================ */
.section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 14px;
  margin: 26px 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.section-head.first { margin-top: 0; }
.section-head h2 {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin: 0;
  color: var(--text-secondary);
}
/* The board is a point-in-time read. Live work ages far faster than git
   health, so this section states its own age and degrades as it goes. */
.age {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.age.aging { color: var(--warning); }
.age.stale { color: var(--critical); font-weight: 700; }
.notice {
  margin-bottom: 12px;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 0.82rem;
  border: 1px solid var(--border-strong);
  background: var(--bg-raised);
  color: var(--text-secondary);
}
.notice.stale {
  border-color: var(--critical);
  background: var(--critical-soft);
  color: var(--critical);
  font-weight: 600;
}
.live-rows { display: flex; flex-direction: column; gap: 8px; }
.live-row {
  display: grid;
  grid-template-columns: 4px minmax(0, 1fr);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.live-row .accent { background: var(--border-strong); }
/* Reserved strictly for a row that genuinely wants him - the whole point of
   the surface is that this treatment is never ambiguous. */
.live-row.wants { background: var(--critical-soft); border-color: var(--critical); }
.live-row.wants .accent { background: var(--critical); }
/* Captain has the conn: he is standing in that terminal already. Deliberately
   calm, and reuses the same blue the project half uses for "this one is mine",
   so it never reads as stuck and never reads as wanting him. */
.live-row.conn { background: var(--recent-mine-bg); border-color: var(--recent-mine-border); }
.live-row.conn .accent { background: var(--recent-mine-border); }
.live-body {
  min-width: 0;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.live-top {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
}
.live-project {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.95rem;
  overflow-wrap: anywhere;
}
.live-task {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  overflow-wrap: anywhere;
}
.badge {
  margin-left: auto;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 2px 7px;
  border-radius: 3px;
  white-space: nowrap;
  color: var(--text-muted);
  background: var(--border);
}
.badge.wants { color: var(--critical-ink); background: var(--critical); }
.badge.conn { color: var(--conn-ink); background: var(--recent-mine-border); }
.badge.watch { color: var(--warning); background: var(--warning-soft); }
.live-activity { font-size: 0.86rem; }
.live-note {
  font-size: 0.8rem;
  color: var(--text-secondary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.live-title {
  font-size: 0.78rem;
  color: var(--text-muted);
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.live-term {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 8px;
  margin-top: 4px;
  font-size: 0.78rem;
  color: var(--text-muted);
  min-width: 0;
}
.live-term .term-gone { color: var(--warning); font-weight: 600; }
.live-cmd {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  color: var(--text-primary);
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 6px;
  max-width: 100%;
  overflow-x: auto;
  white-space: nowrap;
  user-select: all;
}
button.copy {
  font-family: var(--font-sans);
  font-size: 0.72rem;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--bg-raised);
  color: var(--text-primary);
  border-radius: 3px;
  padding: 2px 8px;
  white-space: nowrap;
}
button.copy:hover { border-color: var(--text-secondary); }
button.copy:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 1px; }
</style>
</head>
<body>
<main>
  <header class="page-head">
    <h1>Fleet dashboard</h1>
    <span class="generated" id="generated-at"></span>
  </header>

  <section id="live-section" hidden>
    <div class="section-head first">
      <h2>Live work</h2>
      <span class="age" id="live-age"></span>
    </div>
    <div class="notice" id="live-notice" hidden></div>
    <div class="summary" id="live-summary"></div>
    <div class="live-rows" id="live-rows"></div>
  </section>

  <section id="projects-section">
    <div class="section-head" id="projects-head">
      <h2>Projects</h2>
    </div>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<script id="dashboard-data" type="application/json">
__FM_DASHBOARD_DATA__
</script>
<script id="dashboard-live" type="application/json">
__FM_DASHBOARD_LIVE__
</script>
<script>
(function () {
  var raw = document.getElementById('dashboard-data').textContent;
  var data;
  try {
    data = JSON.parse(raw);
  } catch (e) {
    document.getElementById('grid').innerHTML = '<div class="empty-state">Could not read dashboard data.</div>';
    return;
  }

  var projects = data.projects || [];

  document.getElementById('generated-at').textContent =
    'generated ' + (data.generated_at || 'unknown');

  function attentionScore(p) {
    if (p.available === false) return 3;
    if (p.clean === false) return 2;
    if (p.on_default === false) return 1;
    return 0;
  }
  projects = projects.slice().sort(function (a, b) {
    return attentionScore(b) - attentionScore(a);
  });

  var clean = 0, uncommitted = 0, offDefault = 0, unavailable = 0;
  projects.forEach(function (p) {
    if (p.available === false) { unavailable++; return; }
    if (p.clean) clean++; else uncommitted++;
    if (p.on_default === false) offDefault++;
  });

  var summaryEl = document.getElementById('summary');
  summaryEl.appendChild(strongify(projects.length + ' project' + (projects.length === 1 ? '' : 's'), 'clean'));
  summaryEl.appendChild(strongify(uncommitted + ' uncommitted', 'uncommitted'));
  summaryEl.appendChild(strongify(clean + ' clean', 'clean'));
  summaryEl.appendChild(strongify(offDefault + ' off default branch', 'unknown'));
  if (unavailable > 0) {
    summaryEl.appendChild(strongify(unavailable + ' unavailable', 'unknown'));
  }

  function strongify(text, dotClass) {
    var span = document.createElement('span');
    var dot = document.createElement('span');
    dot.className = 'dot ' + dotClass;
    span.appendChild(dot);
    var parts = text.split(/(\d+)/);
    parts.forEach(function (part, i) {
      if (i === 1) {
        var strong = document.createElement('strong');
        strong.textContent = part;
        span.appendChild(strong);
      } else if (part) {
        span.appendChild(document.createTextNode(part));
      }
    });
    return span;
  }

  var grid = document.getElementById('grid');
  if (projects.length === 0) {
    grid.innerHTML = '<div class="empty-state">No projects registered.</div>';
    return;
  }

  projects.forEach(function (p) {
    grid.appendChild(renderCard(p));
  });

  function recentClass(p) {
    if (!p.last_commit || !p.last_commit.date) return '';
    var d = new Date(p.last_commit.date);
    if (isNaN(d.getTime())) return '';
    var days = (Date.now() - d.getTime()) / (24 * 60 * 60 * 1000);
    if (days < 0 || days > 7) return '';
    return p.last_commit.mine ? ' recent-mine' : ' recent-team';
  }

  function renderCard(p) {
    var card = document.createElement('div');
    card.className = 'card' + recentClass(p);

    var dot = document.createElement('span');
    var label = document.createElement('span');
    var name = document.createElement('span');
    name.className = 'proj-name';
    name.textContent = p.name;

    if (p.available === false) {
      var head = document.createElement('div');
      head.className = 'card-head';
      head.appendChild(name);

      dot.className = 'status-dot unknown';
      label.className = 'status-label unknown';
      label.textContent = 'unavailable';
      head.appendChild(dot);
      head.appendChild(label);

      var reason = document.createElement('div');
      reason.className = 'unavailable-reason';
      reason.textContent = p.reason || 'clone not found';
      head.appendChild(reason);

      card.appendChild(head);
      return card;
    }

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'card-head';
    button.setAttribute('aria-expanded', 'false');
    button.appendChild(name);

    dot.className = 'status-dot ' + (p.clean ? 'clean' : 'uncommitted');
    label.className = 'status-label ' + (p.clean ? 'clean' : 'uncommitted');
    label.textContent = p.clean ? 'clean' : 'uncommitted';
    button.appendChild(dot);
    button.appendChild(label);

    var branchRow = document.createElement('div');
    branchRow.className = 'branch-row';
    var branchName = document.createElement('span');
    branchName.className = 'branch-name';
    branchName.textContent = p.branch || 'unknown';
    branchRow.appendChild(branchName);
    if (p.on_default === false) {
      var flag = document.createElement('span');
      flag.className = 'branch-flag';
      flag.title = 'Not on default branch (' + (p.default_branch || 'unknown') + ')';
      flag.textContent = '⚑ not default';
      branchRow.appendChild(flag);
    }
    button.appendChild(branchRow);

    var lastCommit = document.createElement('div');
    lastCommit.className = 'last-commit';
    if (p.last_commit && p.last_commit.date) {
      lastCommit.textContent = fmtDate(p.last_commit.date) + ' · ' + (p.last_commit.author || 'unknown');
    } else {
      lastCommit.textContent = 'no commits';
    }
    button.appendChild(lastCommit);

    button.addEventListener('click', function () {
      var isOpen = card.classList.toggle('open');
      button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
    card.appendChild(button);

    var panel = document.createElement('div');
    panel.className = 'commits-panel';
    var ol = document.createElement('ol');
    (p.commits || []).forEach(function (c) {
      var li = document.createElement('li');

      var authorLine = document.createElement('span');
      authorLine.className = 'author';
      authorLine.textContent = c.author || 'unknown';
      li.appendChild(authorLine);

      var hash = document.createElement('span');
      hash.className = 'hash';
      hash.textContent = c.hash || '';
      li.appendChild(hash);

      var date = document.createElement('span');
      date.className = 'date';
      date.textContent = fmtDate(c.date);
      li.appendChild(date);

      var subject = document.createElement('span');
      subject.className = 'subject';
      subject.textContent = c.subject || '';
      li.appendChild(subject);

      ol.appendChild(li);
    });
    panel.appendChild(ol);
    card.appendChild(panel);

    return card;
  }

  function fmtDate(iso) {
    if (!iso) return 'unknown';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toISOString().slice(0, 16).replace('T', ' ');
  }
})();
</script>
<script>
/* ============================================================
   LIVE WORK half of the board.

   Deliberately a separate, self-contained block: it reads its own
   payload slot and touches nothing the project half owns.

   Honest about age. The page is generated when /dashboard runs; there
   is no live feed behind it. Live work goes stale in a way git health
   does not - a worker parked on a decision can be working again a
   minute later - so this section states its own age, recomputes it
   from the payload timestamp while the tab stays open, and degrades
   visibly rather than presenting an old read as current. The captain
   walking into the wrong terminal on 40-minute-old state is the exact
   failure this guards against.
   ============================================================ */
(function () {
  var AGING_MINUTES = 2;
  var STALE_MINUTES = 10;

  var section = document.getElementById('live-section');
  var slot = document.getElementById('dashboard-live');
  var projectsHead = document.getElementById('projects-head');

  function projectHalfOnly() {
    if (section) { section.hidden = true; }
    if (projectsHead) { projectsHead.classList.add('first'); }
  }

  if (!section || !slot) { projectHalfOnly(); return; }

  var data;
  try {
    data = JSON.parse(slot.textContent);
  } catch (e) {
    data = undefined;
  }

  /* A null slot means this board was built without a live read at all
     (serve.sh fills the slot with null when no --live is given), so the
     page is exactly the project board and claims nothing about live work.
     An available:false payload is different: a read was attempted and
     failed, and hiding that would let an empty section read as "nothing
     is running". */
  if (data === null || data === undefined) { projectHalfOnly(); return; }

  section.hidden = false;

  var notice = document.getElementById('live-notice');
  var ageEl = document.getElementById('live-age');
  var summaryEl = document.getElementById('live-summary');
  var rowsEl = document.getElementById('live-rows');

  if (data.available === false) {
    ageEl.textContent = '';
    notice.hidden = false;
    notice.className = 'notice';
    notice.textContent = 'Live work could not be read for this board' +
      (data.reason ? ': ' + data.reason : '') +
      '. The project health below is unaffected.';
    return;
  }

  var tasks = data.tasks || [];

  /* --- summary chips, same styling as the project half ---------------- */
  function chip(text, dotClass) {
    var span = document.createElement('span');
    var dot = document.createElement('span');
    dot.className = 'dot ' + dotClass;
    span.appendChild(dot);
    var parts = text.split(/(\d+)/);
    parts.forEach(function (part, i) {
      if (i === 1) {
        var strong = document.createElement('strong');
        strong.textContent = part;
        span.appendChild(strong);
      } else if (part) {
        span.appendChild(document.createTextNode(part));
      }
    });
    return span;
  }

  var wants = 0, goneTerminals = 0, conn = 0;
  tasks.forEach(function (t) {
    if (t.waiting && t.waiting.wants_captain) { wants++; }
    if (t.waiting && t.waiting.kind === 'conn') { conn++; }
    if (t.terminal && t.terminal.presence === 'gone') { goneTerminals++; }
  });

  summaryEl.appendChild(chip(tasks.length + ' running', 'clean'));
  summaryEl.appendChild(chip(wants + ' waiting on you', wants > 0 ? 'uncommitted' : 'unknown'));
  if (conn > 0) { summaryEl.appendChild(chip(conn + ' you have the conn', 'unknown')); }
  if (goneTerminals > 0) { summaryEl.appendChild(chip(goneTerminals + ' with no terminal', 'unknown')); }

  /* --- age, recomputed while the tab is open -------------------------- */
  function ageMinutes() {
    var t = Date.parse(data.generated_at);
    if (isNaN(t)) { return null; }
    var mins = (Date.now() - t) / 60000;
    return mins < 0 ? 0 : mins;
  }

  /* Bare duration ("43 min"), so it reads correctly both as "as of 43 min ago"
     and as "this view is 43 min old". */
  function durationWords(mins) {
    if (mins < 60) { return Math.floor(mins) + ' min'; }
    return Math.floor(mins / 60) + 'h ' + Math.floor(mins % 60) + 'm';
  }

  function ageWords(mins) {
    if (mins < 1) { return 'as of just now'; }
    return 'as of ' + durationWords(mins) + ' ago';
  }

  function renderAge() {
    var mins = ageMinutes();
    if (mins === null) {
      ageEl.className = 'age stale';
      ageEl.textContent = 'age unknown';
      notice.hidden = false;
      notice.className = 'notice stale';
      notice.textContent = 'This live view cannot report its own age. ' +
        'Re-run /dashboard before relying on it.';
      return;
    }
    ageEl.textContent = ageWords(mins);
    if (mins >= STALE_MINUTES) {
      ageEl.className = 'age stale';
      notice.hidden = false;
      notice.className = 'notice stale';
      notice.textContent = 'This live view is ' + durationWords(mins) +
        ' old. A worker can change state in seconds, so re-run /dashboard ' +
        'before walking into a terminal on the strength of it.';
    } else if (mins >= AGING_MINUTES) {
      ageEl.className = 'age aging';
      notice.hidden = true;
    } else {
      ageEl.className = 'age';
      notice.hidden = true;
    }
  }
  renderAge();
  setInterval(renderAge, 15000);

  if (tasks.length === 0) {
    rowsEl.innerHTML = '<div class="empty-state">No work running.</div>';
    return;
  }

  /* --- rows, rendered in the payload's own order ---------------------- */
  function copyButton(command) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'copy';
    btn.textContent = 'copy';
    var reset = function () {
      setTimeout(function () { btn.textContent = 'copy'; }, 1400);
    };
    var ok = function () { btn.textContent = 'copied'; reset(); };
    var manual = function () { btn.textContent = 'select it'; reset(); };
    btn.addEventListener('click', function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(command).then(ok, function () { legacy(command, ok, manual); });
      } else {
        legacy(command, ok, manual);
      }
    });
    return btn;
  }

  function legacy(command, ok, manual) {
    var ta = document.createElement('textarea');
    ta.value = command;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (e) { copied = false; }
    document.body.removeChild(ta);
    if (copied) { ok(); } else { manual(); }
  }

  function line(cls, text) {
    var el = document.createElement('div');
    el.className = cls;
    el.textContent = text;
    el.title = text;
    return el;
  }

  tasks.forEach(function (t) {
    var waiting = t.waiting || {};
    var terminal = t.terminal || {};

    var row = document.createElement('div');
    row.className = 'live-row' +
      (waiting.wants_captain ? ' wants' : '') +
      (waiting.kind === 'conn' ? ' conn' : '');

    var accent = document.createElement('div');
    accent.className = 'accent';
    row.appendChild(accent);

    var body = document.createElement('div');
    body.className = 'live-body';

    var top = document.createElement('div');
    top.className = 'live-top';
    var project = document.createElement('span');
    project.className = 'live-project';
    project.textContent = t.project || 'unregistered';
    top.appendChild(project);
    var taskId = document.createElement('span');
    taskId.className = 'live-task';
    taskId.textContent = t.id;
    top.appendChild(taskId);

    var badge = document.createElement('span');
    badge.className = 'badge' +
      (waiting.wants_captain ? ' wants' : '') +
      (waiting.kind === 'conn' ? ' conn' : '') +
      (waiting.kind === 'unclear' ? ' watch' : '');
    badge.textContent = waiting.label || 'unclear';
    top.appendChild(badge);
    body.appendChild(top);

    if (t.title) { body.appendChild(line('live-title', t.title)); }
    body.appendChild(line('live-activity', t.activity || 'unknown'));
    if (waiting.note) { body.appendChild(line('live-note', waiting.note)); }

    if (t.pr_url) {
      var prWrap = document.createElement('div');
      prWrap.className = 'live-note';
      var prLink = document.createElement('a');
      prLink.href = t.pr_url;
      prLink.textContent = t.pr_url;
      prLink.rel = 'noreferrer noopener';
      prWrap.appendChild(prLink);
      body.appendChild(prWrap);
    }

    var term = document.createElement('div');
    term.className = 'live-term';
    var label = document.createElement('span');
    if (terminal.presence === 'gone') {
      label.className = 'term-gone';
      label.textContent = 'no terminal - ' + (terminal.presence_note || '');
    } else {
      label.textContent = 'terminal: ' + (terminal.presence_note || 'unknown');
    }
    term.appendChild(label);

    /* Button before the command, so it stays in the same place on every row -
       he is jumping between terminals, not reading one row. */
    if (terminal.command) {
      term.appendChild(copyButton(terminal.command));
      var cmd = document.createElement('code');
      cmd.className = 'live-cmd';
      cmd.textContent = terminal.command;
      term.appendChild(cmd);
    }
    body.appendChild(term);

    row.appendChild(body);
    rowsEl.appendChild(row);
  });
})();
</script>
</body>
</html>
